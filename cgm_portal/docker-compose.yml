services:
  db:
    image: postgres:16-alpine
    container_name: cgm_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cgm_portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-cgm_portal_db}
    ports:
      - "9081:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cgm_portal}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cgm_portal_app
    env_file: .env
    environment:
      # +psycopg2 is EXPLICIT and load-bearing (#711, #930): a bare
      # `postgresql://` lets the INSTALLED SQLAlchemy pick the driver, and
      # 2.1 resolves it to psycopg v3, which is not installed here.
      # SQLAlchemy==2.0.50 pinned. requirements.txt already EXPLAINS this
      # mitigation (#785's comment block); the compose did not apply it.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-cgm_portal}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-cgm_portal_db}
    ports:
      - "9080:9080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
